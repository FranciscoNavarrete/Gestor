<h2 mat-dialog-title>Registrar entrega de efectivo</h2>

<mat-dialog-content class="contenido">
  <p class="subtitulo">{{ data.nombre }} · tiene a su cargo {{ dinero(data.enPoder) }}</p>

  <mat-form-field appearance="outline">
    <mat-label>Monto entregado</mat-label>
    <input matInput type="number" min="1" [max]="data.enPoder" [(ngModel)]="monto" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha</mat-label>
    <input matInput type="date" [(ngModel)]="fecha" [max]="hoy" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Nota (opcional)</mat-label>
    <input matInput [(ngModel)]="nota" maxlength="300" />
  </mat-form-field>

  <p class="aviso">Lo que entregue se resta de lo que tiene a su cargo. Si te equivocás, podés anular la entrega.</p>

  @if (error(); as mensaje) {
    <p class="error">{{ mensaje }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Cancelar</button>
  <button mat-flat-button type="button" (click)="guardar()" [disabled]="guardando()">
    {{ guardando() ? 'Guardando…' : 'Registrar entrega' }}
  </button>
</mat-dialog-actions>
