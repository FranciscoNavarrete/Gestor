<h2 mat-dialog-title>{{ esEdicion ? 'Editar medio de pago' : 'Nuevo medio de pago' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" cdkFocusInitial />
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando()">
      {{ esEdicion ? 'Guardar' : 'Crear' }}
    </button>
  </mat-dialog-actions>
</form>
