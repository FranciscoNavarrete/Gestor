<div class="auth-page">
  <div class="brand-mark">
    <svg class="brand-mark-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="6" cy="18" r="2.5" fill="currentColor" />
      <path
        d="M8.2 16.3C11 12.2 14.7 8.6 17.8 6.4"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-dasharray="0.4 3"
        opacity="0.9"
        fill="none"
      />
      <circle cx="17.5" cy="6.5" r="5.4" stroke="currentColor" stroke-width="1.8" fill="none" />
      <ellipse cx="17.5" cy="6.5" rx="2.2" ry="5.4" stroke="currentColor" stroke-width="1.3" fill="none" opacity="0.75" />
      <line x1="12" y1="6.5" x2="23" y2="6.5" stroke="currentColor" stroke-width="1.3" opacity="0.75" />
    </svg>
  </div>

  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title class="font-display">GestorPOS</mat-card-title>
      <mat-card-subtitle>Ingresá a tu negocio</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="enviar()" class="form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="ocultarPassword() ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="ocultarPassword.set(!ocultarPassword())"
            [attr.aria-label]="'Mostrar contraseña'"
          >
            <mat-icon>{{ ocultarPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || cargando()">
          @if (cargando()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Ingresar
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
