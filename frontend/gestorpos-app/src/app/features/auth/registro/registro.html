<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Registrá tu negocio</mat-card-title>
      <mat-card-subtitle>Creá tu cuenta en GestorPOS</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="enviar()" class="form">
        <mat-form-field appearance="outline">
          <mat-label>Nombre del negocio</mat-label>
          <input matInput formControlName="nombreNegocio" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Tu nombre</mat-label>
          <input matInput formControlName="nombreAdmin" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="ocultarPassword() ? 'password' : 'text'"
            formControlName="password"
            autocomplete="new-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="ocultarPassword.set(!ocultarPassword())"
            [attr.aria-label]="'Mostrar contraseña'"
          >
            <mat-icon>{{ ocultarPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || cargando()">
          @if (cargando()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Crear negocio
          }
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer class="footer">
      <a routerLink="/login">¿Ya tenés cuenta? Ingresá</a>
    </mat-card-footer>
  </mat-card>
</div>
