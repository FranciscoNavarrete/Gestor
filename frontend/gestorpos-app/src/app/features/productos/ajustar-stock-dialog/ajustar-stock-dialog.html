<h2 mat-dialog-title>Ajustar stock — {{ producto.nombre }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <p class="stock-actual">Stock actual: <strong>{{ stockTexto }}</strong></p>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Cantidad (con - para restar)</mat-label>
      <input matInput type="number" formControlName="cantidad" [attr.step]="medida ? 0.001 : 1" cdkFocusInitial />
      @if (medida) {
        <span matTextSuffix>{{ simbolo }}</span>
      }
      <mat-hint>{{ medida ? 'Ej: 12,5 repone · -0,3 descuenta' : 'Ej: 10 repone · -2 descuenta' }}</mat-hint>
    </mat-form-field>

    <p class="motivo-label">Motivo</p>
    <div class="motivo-chips">
      @for (m of motivos; track m) {
        <button
          type="button"
          class="chip-motivo"
          [class.activo]="motivo() === m"
          (click)="elegirMotivo(m)"
        >
          {{ m }}
        </button>
      }
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || !motivo() || guardando()">
      Ajustar
    </button>
  </mat-dialog-actions>
</form>
