<h2 mat-dialog-title>Ajustar stock — {{ producto.nombre }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <p class="stock-actual">Stock actual: <strong>{{ producto.stockActual }}</strong></p>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Cantidad a sumar (o restar, con signo negativo)</mat-label>
      <input matInput type="number" formControlName="cantidad" cdkFocusInitial />
      <mat-hint>Ej: 10 para reponer, -2 para descontar por rotura o pérdida</mat-hint>
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando()">
      Ajustar
    </button>
  </mat-dialog-actions>
</form>
