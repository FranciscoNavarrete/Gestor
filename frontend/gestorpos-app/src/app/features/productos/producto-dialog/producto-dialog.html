<h2 mat-dialog-title>{{ esEdicion ? 'Editar producto' : 'Nuevo producto' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full">
      <mat-label>SKU</mat-label>
      <input matInput formControlName="sku" [readonly]="esEdicion" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" cdkFocusInitial />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Categoría</mat-label>
      <mat-select formControlName="categoriaId">
        <mat-option [value]="null">Sin categoría</mat-option>
        @for (categoria of categorias(); track categoria.id) {
          <mat-option [value]="categoria.id">{{ categoria.nombre }}</mat-option>
        }
      </mat-select>
      <button mat-icon-button matSuffix type="button" (click)="nuevaCategoria()" aria-label="Nueva categoría">
        <mat-icon>add</mat-icon>
      </button>
    </mat-form-field>

    <div class="fila">
      <mat-form-field appearance="outline">
        <mat-label>Precio de venta</mat-label>
        <input matInput type="number" formControlName="precio" min="0" step="0.01" placeholder="0" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Costo</mat-label>
        <input matInput type="number" formControlName="costo" min="0" step="0.01" placeholder="0" />
      </mat-form-field>
    </div>

    <div class="fila">
      @if (!esEdicion) {
        <mat-form-field appearance="outline">
          <mat-label>Stock inicial</mat-label>
          <input matInput type="number" formControlName="stockActual" min="0" placeholder="0" />
        </mat-form-field>
      }

      <mat-form-field appearance="outline">
        <mat-label>Stock mínimo</mat-label>
        <input matInput type="number" formControlName="stockMinimo" min="0" placeholder="0" />
      </mat-form-field>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando()">
      Guardar
    </button>
  </mat-dialog-actions>
</form>
