<div class="pagina">
  <mat-card class="card">
    <mat-card-header>
      <mat-card-title>Panel interno</mat-card-title>
      <mat-card-subtitle>Ingresá con tu usuario administrador</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="ingresar()" class="form">
        <mat-form-field appearance="outline" class="full">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" cdkFocusInitial autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || iniciandoSesion()">
          @if (iniciandoSesion()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Entrar
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
