<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title class="font-display">Elegí tu contraseña</mat-card-title>
      <mat-card-subtitle>Entraste con una contraseña temporal. Elegí una nueva para seguir.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <app-cambiar-password [guardar]="guardar" [temporal]="true" textoBoton="Guardar y entrar" (cambiada)="alCambiar()" />
      <p class="salir"><button type="button" class="enlace" (click)="cerrarSesion()">Cerrar sesión</button></p>
    </mat-card-content>
  </mat-card>
</div>
