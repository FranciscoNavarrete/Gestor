[build]
  base = "frontend/gestorpos-app"
  command = "npm run build"
  publish = "dist/gestorpos-app/browser"

# Rama qas: build apuntando al backend de QAS (Railway, ambiente "qas") en vez de al de
# producción — ver frontend/gestorpos-app/src/environments/environment.qas.ts.
[context.qas]
  command = "npm run build:qas"

# iOS lee el manifest/título del HTML estático al "Agregar a inicio", no del DOM ya mutado por
# JS — por eso /admin/* sirve un HTML aparte (admin.html) con el manifest de admin ya puesto.
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
