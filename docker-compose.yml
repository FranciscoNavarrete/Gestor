services:
  postgres:
    image: postgres:16-alpine
    container_name: gestorpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestorpos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - gestorpos-postgres-data:/var/lib/postgresql/data

volumes:
  gestorpos-postgres-data:
